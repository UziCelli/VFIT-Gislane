name: Publicar conector do Claude (Cloudflare)

# Publica o Worker do conector (pasta conector/) na Cloudflare: MCP + login OAuth do claude.ai.
# Mesmos secrets do push.yml: CLOUDFLARE_API_TOKEN (Edit Cloudflare Workers e acesso ao namespace KV) e CLOUDFLARE_ACCOUNT_ID.
# O KV OAUTH_KV já foi criado; seu ID consta em conector/wrangler.toml.
on:
  # Só entra na fila depois de Publicar liberar o grupo compartilhado.
  workflow_run:
    workflows: [Publicar]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: repository-workflows
  cancel-in-progress: false
  queue: max

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       contains(fromJSON('["success","failure"]'), github.event.workflow_run.conclusion) &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: Confirmar versão atual e publicação compatível sem bloquear a fila
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
          PUBLISH_RUN: ${{ github.event.workflow_run.id }}
        run: |
          atual=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')
          if [ "$atual" != "$COMMIT" ]; then
            echo "::error::Versão ultrapassada; publique a main atual antes de publicar o conector."
            exit 1
          fi
          run_id="$PUBLISH_RUN"
          if [ -z "$run_id" ]; then
            run_id=$(gh api "repos/$GH_REPO/actions/workflows/deploy.yml/runs?head_sha=$COMMIT&status=completed&per_page=100" --jq '.workflow_runs[0].id // empty')
          fi
          if [ -z "$run_id" ]; then
            echo "::error::Publique o app deste commit primeiro e depois execute o conector."
            exit 1
          fi
          estado=$(gh api --paginate "repos/$GH_REPO/actions/runs/$run_id/jobs?per_page=100" --jq '.jobs[] | select(.name == "deploy") | .conclusion')
          if [ "$estado" != success ]; then
            echo "::error::App ou regras não publicados; conector preservado."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            conector/package-lock.json
      - name: Instalar dependências compartilhadas com o app
        run: npm ci
      - name: Instalar dependências do conector
        working-directory: conector
        run: npm ci
      - name: Conferir o bundle antes de acessar serviços externos
        working-directory: conector
        run: npx --yes --package=wrangler@4.161.0 wrangler deploy --dry-run
      - name: Validar App Check antes da publicação
        env:
          APPCHECK_DEBUG_TOKEN: ${{ secrets.APPCHECK_DEBUG_TOKEN }}
          FIREBASE_PROJECT_ID: forca--app
        run: |
          if [ -z "$APPCHECK_DEBUG_TOKEN" ]; then
            echo "::error::Cadastre o segredo APPCHECK_DEBUG_TOKEN no GitHub antes de publicar; consulte docs/seguranca.md."
            exit 1
          fi
          # Valores públicos do mesmo app usado pelo Worker.
          export FIREBASE_API_KEY=$(grep '^VITE_FIREBASE_API_KEY=' .env.production | cut -d= -f2)
          export FIREBASE_APP_ID=$(grep '^VITE_FIREBASE_APP_ID=' .env.production | cut -d= -f2)
          node tools/conector-appcheck-check.mjs
      - name: Atualizar segredo e publicar o Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          APPCHECK_DEBUG_TOKEN: ${{ secrets.APPCHECK_DEBUG_TOKEN }}
          # Desligamento de emergência: variável do repositório EDICAO_COMPLETA=0 (Settings → Variables). Sem valor = ligada.
          EDICAO_COMPLETA: ${{ vars.EDICAO_COMPLETA }}
          BUILD_COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
        working-directory: conector
        run: |
          chave=$(grep '^VITE_FIREBASE_API_KEY=' ../.env.production | cut -d= -f2)
          appid=$(grep '^VITE_FIREBASE_APP_ID=' ../.env.production | cut -d= -f2)
          printf %s "$APPCHECK_DEBUG_TOKEN" | npx --yes --package=wrangler@4.161.0 wrangler secret put APPCHECK_DEBUG_TOKEN
          npx --yes --package=wrangler@4.161.0 wrangler deploy --var "FIREBASE_API_KEY:$chave" --var "FIREBASE_APP_ID:$appid" --var "BUILD_ID:$BUILD_COMMIT" --var "EDICAO_COMPLETA:${EDICAO_COMPLETA:-1}"
      - name: Conferir o Worker no ar
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          sub=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | jq -r '.result.subdomain')
          url="https://vfit-conector.${sub}.workers.dev"
          echo "URL do conector: $url"
          {
            echo "### URL do conector do Claude"
            echo
            echo "\`$url\` (no claude.ai: \`$url/mcp\`). Use como \`VITE_CONECTOR_URL\` no app."
          } >> "$GITHUB_STEP_SUMMARY"
          # Sem token, o MCP responde 401 e o OAuth publica os metadados.
          test "$(curl -s -A 'Mozilla/5.0 (compatible; VFIT-MCP-Healthcheck/1.0)' -o /dev/null -w '%{http_code}' -X POST "$url/mcp" -H 'Content-Type: application/json' -d '{}')" = 401
          test "$(curl -s -A 'Mozilla/5.0 (compatible; VFIT-MCP-Healthcheck/1.0)' -o /dev/null -w '%{http_code}' "$url/.well-known/oauth-authorization-server")" = 200
          test "$(curl -s -A 'Mozilla/5.0 (compatible; VFIT-MCP-Healthcheck/1.0)' -o /dev/null -w '%{http_code}' "$url/.well-known/oauth-protected-resource/mcp")" = 200

  # Gislane: outro Worker (gislane-conector) com o mesmo código, KV e Durable Objects próprios.
  # Segredo próprio: APPCHECK_DEBUG_TOKEN_GISLANE (debug token registrado no App Check do projeto
  # gislane-personal-trainer). Sem ele, o job só avisa e não publica. Não depende do job da VFIT.
  gislane:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       contains(fromJSON('["success","failure"]'), github.event.workflow_run.conclusion) &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      # O segredo só entra nas etapas que precisam dele (nunca na instalação de dependências).
      - name: Aguardar configuração do App Check da Gislane
        id: config
        env:
          APPCHECK_DEBUG_TOKEN: ${{ secrets.APPCHECK_DEBUG_TOKEN_GISLANE }}
        run: |
          if [ -z "$APPCHECK_DEBUG_TOKEN" ]; then
            echo "::warning::Conector da Gislane não publicado: cadastre o segredo APPCHECK_DEBUG_TOKEN_GISLANE (docs/conector-prescricao.md)."
            echo "pronto=0" >> "$GITHUB_OUTPUT"
          else
            echo "pronto=1" >> "$GITHUB_OUTPUT"
          fi
      - name: Confirmar versão atual e app da Gislane publicado
        if: steps.config.outputs.pronto == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
          PUBLISH_RUN: ${{ github.event.workflow_run.id }}
        run: |
          atual=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')
          if [ "$atual" != "$COMMIT" ]; then
            echo "::error::Versão ultrapassada; publique a main atual antes de publicar o conector."
            exit 1
          fi
          run_id="$PUBLISH_RUN"
          if [ -z "$run_id" ]; then
            run_id=$(gh api "repos/$GH_REPO/actions/workflows/deploy.yml/runs?head_sha=$COMMIT&status=completed&per_page=100" --jq '.workflow_runs[0].id // empty')
          fi
          if [ -z "$run_id" ]; then
            echo "::error::Publique o app deste commit primeiro e depois execute o conector."
            exit 1
          fi
          estado=$(gh api --paginate "repos/$GH_REPO/actions/runs/$run_id/jobs?per_page=100" --jq '.jobs[] | select(.name == "gislane") | .conclusion')
          if [ "$estado" != success ]; then
            echo "::error::App ou regras da Gislane não publicados; conector preservado."
            exit 1
          fi
      - uses: actions/checkout@v4
        if: steps.config.outputs.pronto == '1'
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        if: steps.config.outputs.pronto == '1'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            conector/package-lock.json
      - name: Instalar dependências
        if: steps.config.outputs.pronto == '1'
        run: npm ci && npm ci --prefix conector
      - name: Conferir o bundle antes de acessar serviços externos
        if: steps.config.outputs.pronto == '1'
        working-directory: conector
        run: npx --yes --package=wrangler@4.161.0 wrangler deploy --dry-run --env gislane
      - name: Validar App Check da Gislane antes da publicação
        if: steps.config.outputs.pronto == '1'
        env:
          APPCHECK_DEBUG_TOKEN: ${{ secrets.APPCHECK_DEBUG_TOKEN_GISLANE }}
          FIREBASE_PROJECT_ID: gislane-personal-trainer
          APP_REFERER: https://app.gislanepersonaltrainer.com/
        run: |
          export FIREBASE_API_KEY=$(grep '^VITE_FIREBASE_API_KEY=' .env.gislane | cut -d= -f2)
          export FIREBASE_APP_ID=$(grep '^VITE_FIREBASE_APP_ID=' .env.gislane | cut -d= -f2)
          node tools/conector-appcheck-check.mjs
      - name: Publicar o Worker da Gislane com o segredo
        if: steps.config.outputs.pronto == '1'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          APPCHECK_DEBUG_TOKEN: ${{ secrets.APPCHECK_DEBUG_TOKEN_GISLANE }}
          EDICAO_COMPLETA: ${{ vars.EDICAO_COMPLETA }}
          BUILD_COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
        working-directory: conector
        run: |
          chave=$(grep '^VITE_FIREBASE_API_KEY=' ../.env.gislane | cut -d= -f2)
          appid=$(grep '^VITE_FIREBASE_APP_ID=' ../.env.gislane | cut -d= -f2)
          segredos="$RUNNER_TEMP/segredos-gislane.json"
          jq -n --arg t "$APPCHECK_DEBUG_TOKEN" '{APPCHECK_DEBUG_TOKEN: $t}' > "$segredos"
          # Na 1ª publicação o Wrangler cria o KV OAUTH_KV deste Worker; depois reaproveita.
          npx --yes --package=wrangler@4.161.0 wrangler deploy --env gislane --secrets-file "$segredos" --var "FIREBASE_API_KEY:$chave" --var "FIREBASE_APP_ID:$appid" --var "BUILD_ID:$BUILD_COMMIT" --var "EDICAO_COMPLETA:${EDICAO_COMPLETA:-1}"
          rm -f "$segredos"
      - name: Conferir o Worker da Gislane no ar
        if: steps.config.outputs.pronto == '1'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          sub=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | jq -r '.result.subdomain')
          url="https://gislane-conector.${sub}.workers.dev"
          if [ "$sub" != vfitcoach-site ]; then
            echo "::error::Subdomínio Cloudflare mudou ($sub): atualize MCP_RESOURCE em conector/wrangler.toml e VITE_CONECTOR_URL em .env.gislane."
            exit 1
          fi
          {
            echo "### Conector da Gislane"
            echo
            echo "No assistente (Claude ou ChatGPT) da Gislane: \`$url/mcp\`."
          } >> "$GITHUB_STEP_SUMMARY"
          test "$(curl -s -A 'Mozilla/5.0 (compatible; VFIT-MCP-Healthcheck/1.0)' -o /dev/null -w '%{http_code}' -X POST "$url/mcp" -H 'Content-Type: application/json' -d '{}')" = 401
          test "$(curl -s -A 'Mozilla/5.0 (compatible; VFIT-MCP-Healthcheck/1.0)' -o /dev/null -w '%{http_code}' "$url/.well-known/oauth-authorization-server")" = 200
          test "$(curl -s -A 'Mozilla/5.0 (compatible; VFIT-MCP-Healthcheck/1.0)' -o /dev/null -w '%{http_code}' "$url/.well-known/oauth-protected-resource/mcp")" = 200
