name = "vfit-conector"
main = "src/index.ts"
compatibility_date = "2026-06-01"
# agents/mcp/server usa AsyncLocalStorage.
compatibility_flags = ["nodejs_compat"]

# Concessões OAuth; namespace criado na conta do proprietário.
[[kv_namespaces]]
binding = "OAUTH_KV"
id = "5ffec656a3274cc5b4f374944843ffd4"

[vars]
# URL que o claude.ai usa (o token do OAuth vale só para ela).
MCP_RESOURCE = "https://vfit-conector.vfitcoach-site.workers.dev/mcp"
# Onde o coach aprova a conexão.
APP_URL = "https://app.vfitcoachapp.com"
PROJETO = "forca--app"
# FIREBASE_API_KEY (chave web pública do Firebase) não fica aqui: o workflow lê VITE_FIREBASE_API_KEY de .env.production e passa com --var.

[[durable_objects.bindings]]
name = "PEDIDOS"
class_name = "PedidoOAuth"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PedidoOAuth"]

[[durable_objects.bindings]]
name = "PROPOSTAS"
class_name = "PropostaTreino"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["PropostaTreino"]
