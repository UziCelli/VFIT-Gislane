name: Diagnóstico temporário do conector
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Conferir acesso do Worker ao Firebase sem conta real
        run: |
          mkdir -p /tmp/vfit-diag
          cat > /tmp/vfit-diag/wrangler.toml <<'TOML'
          name = "vfit-diagnostico-local"
          main = "index.js"
          compatibility_date = "2026-06-01"
          TOML
          cat > /tmp/vfit-diag/index.js <<'JS'
          export default { async fetch(request, env) {
            const headers = { 'Content-Type': 'application/x-www-form-urlencoded', Referer: 'https://app.vfitcoachapp.com/' };
            try {
              const r = await fetch('https://securetoken.googleapis.com/v1/token?key=' + encodeURIComponent(env.KEY), {
                method: 'POST', headers, body: new URLSearchParams({grant_type:'refresh_token', refresh_token:'invalid'})
              });
              const body = await r.json();
              const known = ['INVALID_REFRESH_TOKEN', 'API_KEY_HTTP_REFERRER_BLOCKED', 'API_KEY_SERVICE_BLOCKED'];
              const reason = body.error?.message;
              return Response.json({ status: r.status, reason: known.includes(reason) ? reason : 'OUTRO' });
            } catch { return Response.json({ status: 0, reason: 'FALHA_REDE' }); }
          }}
          JS
          chave=$(grep '^VITE_FIREBASE_API_KEY=' .env.production | cut -d= -f2)
          cd /tmp/vfit-diag
          npx --yes --package=wrangler@4.161.0 wrangler dev --local --port 8794 --var "KEY:$chave" >/tmp/vfit-diag.log 2>&1 &
          processo=$!
          trap 'kill "$processo" 2>/dev/null || true' EXIT
          for tentativa in $(seq 1 45); do
            if curl --max-time 2 -sS http://127.0.0.1:8794/ >/tmp/vfit-resposta.json 2>/dev/null; then break; fi
            sleep 1
          done
          test -s /tmp/vfit-resposta.json
          cat /tmp/vfit-resposta.json
