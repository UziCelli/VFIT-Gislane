name = "vfit-conector"
main = "src/index.ts"
compatibility_date = "2026-06-01"
# agents/mcp/server usa AsyncLocalStorage.
compatibility_flags = ["nodejs_compat"]

# Concessões OAuth; namespace criado na conta do proprietário.
[[kv_namespaces]]
binding = "OAUTH_KV"
id = "5ffec656a3274cc5b4f374944843ffd4"

[vars]
# URL que o claude.ai usa (o token do OAuth vale só para ela).
MCP_RESOURCE = "https://vfit-conector.vfitcoach-site.workers.dev/mcp"
# Onde o coach aprova a conexão.
APP_URL = "https://app.vfitcoachapp.com"
PROJETO = "forca--app"
# FIREBASE_API_KEY (chave web pública do Firebase) não fica aqui: o workflow lê VITE_FIREBASE_API_KEY de .env.production e passa com --var.

[[durable_objects.bindings]]
name = "PEDIDOS"
class_name = "PedidoOAuth"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PedidoOAuth"]

[[durable_objects.bindings]]
name = "PROPOSTAS"
class_name = "PropostaTreino"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["PropostaTreino"]

# ---- Gislane: outro Worker com o mesmo código, só para o projeto gislane-personal-trainer ----
# Publicado com `wrangler deploy --env gislane`. KV e Durable Objects próprios: nenhuma concessão,
# pedido ou proposta é compartilhado com a VFIT. O KV sem id é criado pelo Wrangler na 1ª publicação
# e reaproveitado nas seguintes (fica associado ao Worker pelo nome do binding).
[env.gislane]
name = "gislane-conector"

[[env.gislane.kv_namespaces]]
binding = "OAUTH_KV"

[env.gislane.vars]
MCP_RESOURCE = "https://gislane-conector.vfitcoach-site.workers.dev/mcp"
APP_URL = "https://app.gislanepersonaltrainer.com"
PROJETO = "gislane-personal-trainer"

[[env.gislane.durable_objects.bindings]]
name = "PEDIDOS"
class_name = "PedidoOAuth"

[[env.gislane.durable_objects.bindings]]
name = "PROPOSTAS"
class_name = "PropostaTreino"

[[env.gislane.migrations]]
tag = "v1"
new_sqlite_classes = ["PedidoOAuth"]

[[env.gislane.migrations]]
tag = "v2"
new_sqlite_classes = ["PropostaTreino"]
